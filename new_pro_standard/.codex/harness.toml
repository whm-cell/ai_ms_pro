[checks]
required_ai_docs = [
  "AGENTS.md",
  "docs/ai/plan.md",
  "docs/ai/working-context.md",
]
required_requirements_docs = [
  "docs/requirements/traceability-matrix.md",
]

[context_surface]
active_handoff_budget = 5
archive_candidate_min_score = 3
warn_at_budget = true

[branch_hygiene]
max_open_total_prs = 10
max_open_codex_prs = 3
max_open_dependabot_prs = 4
max_failed_open_prs = 0

[prototype_design_brief]
enabled = false
artifact_review_enabled = false
brief_path = "docs/ai/prototypes/prototype-design-brief.md"
artifact_dir = ""
prototype_page_path = ""
prototype_route = ""
fixture_paths = []
required_states = []

[config_contracts]
enabled = true
env_template_paths = []
local_env_paths = [
  ".env",
  ".env.local",
]
registry_paths = []
scan_roots = [
  "scripts",
  ".codex/hooks",
]
allowed_literal_paths = []
secret_key_patterns = []
config_key_patterns = []
literal_patterns = []

[mock_data_boundary]
enabled = true
scan_roots = [
  "app",
  "apps",
  "components",
  "pages",
  "src",
]
fixture_paths = [
  "__fixtures__/**",
  "__mocks__/**",
  "fixtures/**",
  "mocks/**",
  "mock-data/**",
  "stories/fixtures/**",
  "tests/fixtures/**",
  "dev-seeds/**",
]
allowed_mock_consumer_paths = [
  "**/*.stories.*",
  "**/*.test.*",
  "**/*.spec.*",
  "tests/**",
]
manifest_required_paths = [
  "fixtures/**",
  "mocks/**",
  "mock-data/**",
  "dev-seeds/**",
]
scenario_manifest_paths = [
  "mock-data/scenarios.jsonl",
  "mocks/scenarios.jsonl",
]
runtime_import_denied_paths = [
  "fixtures/**",
  "mocks/**",
  "mock-data/**",
  "dev-seeds/**",
  "__fixtures__/**",
  "__mocks__/**",
]
import_alias_prefixes = [
  "@/",
  "~/",
]
max_inline_object_items = 3
max_inline_array_from_length = 12
max_inline_lines = 40

[data_activation]
enabled = true
mode = "smoke"

[reuse_retirement]
enabled = true
scan_roots = [
  ".codex/hooks",
  "app",
  "apps",
  "components",
  "lib",
  "packages",
  "pages",
  "scripts",
  "src",
]
new_file_min_lines = 80
reuse_score_threshold = 4
max_candidates = 5
retirement_markers = [
  "demo",
  "deprecated",
  "dev",
  "fixture",
  "legacy",
  "mock",
  "old",
  "seed",
  "smoke",
  "v1",
]

[context_budget]
default_surface_token_budget = 6500
default_surface_warning_percent = 80
default_surface_high_warning_percent = 90
always_on_doc_line_budget = 300
stage_status_line_budget = 120
skill_description_word_budget = 30
skill_body_line_budget = 400
adr_count_budget = 15
mcp_server_budget = 10
skill_catalog_token_budget = 2000
raw_source_token_budget = 30000
static_packet_token_budget = 32000

[runtime_token_budget]
tool_output_token_budget = 5000
last_input_token_budget = 100000
fresh_input_token_budget = 50000
task_complete_budget = 8
token_snapshot_budget = 160
session_minutes_budget = 90
