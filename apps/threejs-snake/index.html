<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Snake</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="game" aria-label="Three.js Snake game board"></canvas>

      <section class="hud" aria-label="Game status">
        <div class="brand">Three.js Snake</div>
        <div class="stats">
          <div>Score <strong id="score">0</strong></div>
          <div>Best <strong id="best">0</strong></div>
        </div>
        <p class="hint">Use arrow keys or WASD. Press Enter to restart.</p>
      </section>

      <section class="overlay" id="overlay" aria-live="polite">
        <div class="panel">
          <h1 id="title">Snake</h1>
          <p id="message">Eat the glowing food, avoid walls and yourself.</p>
          <button id="restart" type="button">Start Game</button>
        </div>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
