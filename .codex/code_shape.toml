version = 1

[scope]
include = [
  "apps/**/*.py",
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "apps/**/*.css",
  "crates/**/*.rs",
  "src/**/*.rs",
  "scripts/*.py",
  "scripts/**/*.py",
  "services/**/*.py",
  "db/**/*.sql",
  ".codex/hooks/*.py",
  ".codex/hooks/**/*.py",
  ".codex/hooks/*.sh",
  ".codex/hooks/**/*.sh",
  ".agents/skills/*/scripts/*.py",
  ".agents/skills/**/scripts/**/*.py",
  ".githooks/pre-commit",
]
exclude = [
  ".codex/.venv/**",
  ".codex/runtime/**",
  "new_pro_standard/**",
  "output/**",
  "**/__pycache__/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/.venv/**",
  "**/venv/**",
]

[targets]
python_file = 300
python_function = 60
python_class = 180
shell_file = 80
rust_file = 350

[thresholds.python_file]
warn = 350
error = 500

[thresholds.python_function]
warn = 80
error = 120

[thresholds.python_class]
warn = 250
error = 350

[thresholds.shell_file]
warn = 120
error = 200

[thresholds.rust_file]
warn = 450
error = 800

[thresholds.typescript_file]
warn = 450
error = 800

[thresholds.stylesheet_file]
warn = 700
error = 1200

[thresholds.sql_file]
warn = 250
error = 500
