name: Governance And Smoke

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  PLAYWRIGHT_VERSION: "1.59.1"
  PLAYWRIGHT_CLI_VERSION: "0.1.13"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python harness dependencies
        run: python3 -m pip install -r .codex/requirements.txt

      - name: Check whitespace errors
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${BEFORE_SHA}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check "HEAD^...HEAD"
          else
            git diff --check
          fi

      - name: Run Ruff checks
        run: python3 -m ruff check .codex/hooks scripts tests

      - name: Check hook config sync
        run: python3 scripts/sync_hooks_config.py --check

      - name: Add advisory follow-up summary for PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 scripts/check_change_triggered_followups.py --base "origin/${{ github.base_ref }}" --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Add branch hygiene summary for PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/check_branch_hygiene.py --markdown --strict --current-pr "${{ github.event.pull_request.number }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add advisory follow-up summary for main push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: python3 scripts/check_change_triggered_followups.py --base "${{ github.event.before }}" --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Add branch hygiene summary for main push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/check_branch_hygiene.py --markdown --strict | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add advisory follow-up note for merge queue
        if: github.event_name == 'merge_group'
        run: |
          {
            echo "### Change-triggered follow-up suggestions"
            echo ""
            echo "Merge queue runs keep the blocking gates. Changed-file advisory summaries are generated on pull_request and main push events."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check PR touch conflicts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr_touch_conflicts.py --current-pr "${{ github.event.pull_request.number }}" --strict-high-risk

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run AI governance checks
        run: python3 scripts/check_ai_governance.py

      - name: Run context budget gate
        run: python3 scripts/check_context_budget.py

      - name: Run agent trace schema checks
        run: python3 scripts/check_agent_trace_schema.py

      - name: Run agent eval dataset checks
        run: python3 scripts/check_agent_eval_dataset.py

      - name: Run agent eval runner dry-run
        run: python3 scripts/run_agent_eval_dataset.py --dry-run

      - name: Run agent trace local export check
        run: python3 scripts/export_agent_trace.py --input docs/ai/standards/agent-trace-sample.jsonl > /tmp/agent-trace-export.json

      - name: Run harness sample gap collector
        run: python3 scripts/collect_harness_sample_gaps.py > /tmp/harness-sample-gaps.md

      - name: Run tool contract checks
        run: python3 scripts/check_tool_contracts.py

      - name: Run code shape checks
        run: python3 scripts/check_code_shape.py --all

      - name: Run skill catalog checks
        run: python3 scripts/check_skill_catalog.py

  windows-hook-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Python resolution unit tests
        run: python -m unittest discover -s tests -p "test_python_resolution.py"

      - name: Run hook sync unit tests
        run: python -m unittest discover -s tests -p "test_hooks_config_sync.py"

      - name: Run PowerShell hook runner governance check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .codex/hooks/run_hook.ps1 stop_ai_docs_check.py

  smoke:
    runs-on: ubuntu-latest
    needs:
      - governance
      - windows-hook-runtime
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Chromium For Playwright
        run: npx --yes --package="playwright@${PLAYWRIGHT_VERSION}" playwright install --with-deps chromium

      - name: Run Three.js Snake smoke
        run: python3 scripts/threejs_snake_smoke.py

      - name: Run Three.js Snake blackbox smoke
        run: python3 scripts/threejs_snake_blackbox_smoke.py

      - name: Run Harness Trace Console smoke
        run: python3 scripts/harness_trace_console_smoke.py

      - name: Run Harness Trace Console blackbox smoke
        run: python3 scripts/harness_trace_console_blackbox_smoke.py

      - name: Run Godot Platformer Slice smoke
        run: python3 scripts/godot_platformer_slice_smoke.py
