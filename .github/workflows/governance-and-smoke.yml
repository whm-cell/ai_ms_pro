name: Governance And Smoke

on:
  pull_request:
  push:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check hook config sync
        run: python3 scripts/sync_hooks_config.py --check

      - name: Run hook sync unit tests
        run: python3 -m unittest discover -s tests -p 'test_hooks_config_sync.py'

      - name: Run runtime metadata unit tests
        run: python3 -m unittest discover -s tests -p 'test_runtime_*.py'

      - name: Run AI governance checks
        run: python3 scripts/check_ai_governance.py

  smoke:
    runs-on: ubuntu-latest
    needs: governance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium For Playwright
        run: npx --yes --package=playwright playwright install --with-deps chromium

      - name: Run Three.js Snake smoke
        run: python3 scripts/threejs_snake_smoke.py

      - name: Run Harness Trace Console smoke
        run: python3 scripts/harness_trace_console_smoke.py

      - name: Run Harness Trace Console blackbox smoke
        run: python3 scripts/harness_trace_console_blackbox_smoke.py
