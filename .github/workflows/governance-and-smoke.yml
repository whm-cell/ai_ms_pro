name: Governance And Smoke

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  PLAYWRIGHT_VERSION: "1.59.1"
  PLAYWRIGHT_CLI_VERSION: "0.1.13"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python harness dependencies
        run: python3 -m pip install -r .codex/requirements.txt

      - name: Check whitespace errors
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${BEFORE_SHA}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check "HEAD^...HEAD"
          else
            git diff --check
          fi

      - name: Run Ruff checks
        run: python3 -m ruff check .codex/hooks scripts tests

      - name: Check hook config sync
        run: python3 scripts/sync_hooks_config.py --check

      - name: Add advisory follow-up summary for PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 scripts/check_change_triggered_followups.py --base "origin/${{ github.base_ref }}" --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Add branch hygiene summary for PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/check_branch_hygiene.py --markdown --strict --current-pr "${{ github.event.pull_request.number }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add advisory follow-up summary for main push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: python3 scripts/check_change_triggered_followups.py --base "${{ github.event.before }}" --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Add branch hygiene summary for main push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/check_branch_hygiene.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add advisory follow-up note for merge queue
        if: github.event_name == 'merge_group'
        run: |
          {
            echo "### Change-triggered follow-up suggestions"
            echo ""
            echo "Merge queue runs keep the blocking gates. Changed-file advisory summaries are generated on pull_request and main push events."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check PR touch conflicts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr_touch_conflicts.py --current-pr "${{ github.event.pull_request.number }}" --strict-high-risk

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run AI governance checks
        run: python3 scripts/check_ai_governance.py

      - name: Run context budget gate
        run: python3 scripts/check_context_budget.py

      - name: Run check burn-in ledger audit
        run: |
          python3 scripts/check_burn_in_ledger.py > /tmp/check-burn-in-ledger.md
          python3 scripts/check_burn_in_ledger.py --json > /tmp/check-burn-in-ledger.json
          {
            echo ""
            echo "### Check burn-in ledger"
            echo ""
            cat /tmp/check-burn-in-ledger.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run check burn-in upgrade decision audit
        run: |
          python3 scripts/check_burn_in_upgrade_decisions.py > /tmp/check-burn-in-upgrade-decisions.md
          python3 scripts/check_burn_in_upgrade_decisions.py --json > /tmp/check-burn-in-upgrade-decisions.json
          {
            echo ""
            echo "### Check burn-in upgrade decisions"
            echo ""
            cat /tmp/check-burn-in-upgrade-decisions.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run runtime token budget wiring check
        run: python3 scripts/check_runtime_token_budget.py

      - name: Run stage checkpoint artifact checks
        run: python3 scripts/check_stage_checkpoints.py

      - name: Run runtime execution snapshot checks
        run: python3 scripts/check_runtime_execution_snapshots.py

      - name: Run PreToolUse preflight sample checks
        run: python3 scripts/check_pre_tool_use_preflight_samples.py

      - name: Run loop scope monitor sample checks
        run: python3 scripts/check_loop_scope_monitor_samples.py

      - name: Run warning sample code alignment check
        run: python3 scripts/check_warning_sample_code_alignment.py

      - name: Run agent trace schema checks
        run: python3 scripts/check_agent_trace_schema.py

      - name: Run agent eval dataset checks
        run: python3 scripts/check_agent_eval_dataset.py

      - name: Run agent eval runner dry-run
        run: python3 scripts/run_agent_eval_dataset.py --dry-run

      - name: Run task outcome eval dataset checks
        run: python3 scripts/check_task_outcome_eval_dataset.py

      - name: Run task outcome eval runner dry-run
        run: python3 scripts/run_task_outcome_eval_dataset.py --dry-run

      - name: Run agent trace local export check
        run: python3 scripts/export_agent_trace.py --input docs/ai/standards/agent-trace-sample.jsonl > /tmp/agent-trace-export.json

      - name: Run remote trace interop report check
        run: python3 scripts/check_remote_trace_interop_report.py

      - name: Run local trace summary smoke
        run: python3 scripts/summarize_runtime_traces.py --runtime-dir .codex/runtime/observations > /tmp/local-trace-summary.md

      - name: Run harness capability summary
        run: |
          python3 scripts/summarize_harness_capabilities.py > /tmp/harness-capability-summary.md
          {
            echo ""
            echo "### Harness capability summary"
            echo ""
            cat /tmp/harness-capability-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run local trace summary sample checks
        run: python3 scripts/check_local_trace_summary_samples.py

      - name: Run agentic red-team sample checks
        run: python3 scripts/check_agentic_red_team_samples.py

      - name: Run harness sample gap evidence checks
        run: python3 scripts/check_harness_sample_gap_evidence.py

      - name: Run harness collection config checks
        run: python3 scripts/check_harness_collection_config.py

      - name: Run harness sample follow-up coverage audit
