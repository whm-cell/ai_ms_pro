          python3 scripts/plan_harness_sample_collection.py --priority P3 --capture-card > /tmp/harness-sample-collection-priority-p3.md
          python3 scripts/plan_harness_sample_collection.py --ledger-action append-new-pending-slot --capture-card > /tmp/harness-sample-collection-append-new-pending-slot.md
          python3 scripts/plan_harness_sample_collection.py --ledger-action fill-existing-placeholder --capture-card > /tmp/harness-sample-collection-fill-existing-placeholder.md
          python3 scripts/plan_harness_sample_collection.py --capture-gate requires-approved-remote-interop --capture-card > /tmp/harness-sample-collection-remote-interop.md
