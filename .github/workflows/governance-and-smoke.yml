          python3 scripts/check_harness_sample_followup_coverage.py > /tmp/harness-sample-followup-coverage.md
          python3 scripts/check_harness_sample_followup_coverage.py --json > /tmp/harness-sample-followup-coverage.json
          {
            echo ""
            echo "### Harness sample follow-up coverage"
            echo ""
            cat /tmp/harness-sample-followup-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run harness sample gap collector
