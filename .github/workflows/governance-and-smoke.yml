          python3 scripts/plan_harness_sample_collection.py > /tmp/harness-sample-collection.md
          python3 scripts/plan_harness_sample_collection.py --json > /tmp/harness-sample-collection.json
          python3 scripts/plan_harness_sample_collection.py --area agentic-red-team --capture-card > /tmp/harness-sample-collection-area-agentic-red-team.md
          python3 scripts/plan_harness_sample_collection.py --area ai-guardrail --capture-card > /tmp/harness-sample-collection-area-ai-guardrail.md
