            cat /tmp/harness-pending-capture-focus-user-confirmed-high-impact-action.md
            echo ""
            echo "### Harness pending next capture focus (needs first real sample)"
            echo ""
            cat /tmp/harness-pending-capture-focus-needs-first-real-sample.md
            echo ""
            echo "### Harness pending next capture focus (needs more real samples)"
            echo ""
            cat /tmp/harness-pending-capture-focus-needs-more-real-samples.md
            echo ""
            echo "### Harness pending placeholder review cards"
            echo ""
            cat /tmp/harness-pending-review-cards.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run harness future-work contract checks
        run: |
          python3 scripts/check_harness_future_work_contracts.py > /tmp/harness-future-work-contracts.md
          python3 scripts/check_harness_future_work_contracts.py --json > /tmp/harness-future-work-contracts.json
          {
            echo ""
            echo "### Harness future-work contract preconditions"
            echo ""
            cat /tmp/harness-future-work-contracts.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run workspace sandbox manifest checks
        run: python3 scripts/check_workspace_sandbox.py

      - name: Run task profile audit sample check
        run: python3 scripts/check_task_profile_audit.py

      - name: Run tool contract checks
        run: python3 scripts/check_tool_contracts.py

      - name: Run Three.js Snake contract checks
        run: python3 scripts/check_threejs_snake_contract.py

      - name: Run code shape checks
        run: python3 scripts/check_code_shape.py --all

      - name: Run skill catalog checks
        run: python3 scripts/check_skill_catalog.py

  windows-hook-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Python resolution unit tests
        run: python -m unittest discover -s tests -p "test_python_resolution.py"

      - name: Run hook sync unit tests
        run: python -m unittest discover -s tests -p "test_hooks_config_sync.py"

      - name: Run PowerShell hook runner governance check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .codex/hooks/run_hook.ps1 stop_ai_docs_check.py

  smoke:
    runs-on: ubuntu-latest
    needs:
      - governance
      - windows-hook-runtime
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Chromium For Playwright
        run: npx --yes --package="playwright@${PLAYWRIGHT_VERSION}" playwright install --with-deps chromium

      - name: Run Three.js Snake smoke
        run: python3 scripts/threejs_snake_smoke.py

      - name: Run Three.js Snake blackbox smoke
        run: python3 scripts/threejs_snake_blackbox_smoke.py

      - name: Run Harness Trace Console smoke
        run: python3 scripts/harness_trace_console_smoke.py

      - name: Run Harness Trace Console blackbox smoke
        run: python3 scripts/harness_trace_console_blackbox_smoke.py
