version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-actions-runtime:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/.codex"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      harness-python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/new_pro_standard/.codex"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      starter-python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      npm-runtime:
        patterns:
          - "*"
